packages:
  - "packages/*"
  # the fixture kit the tests read and the fixture catalogue that shows it
  - "fixtures/*"
  - "config/*"
  # the repository's own commands (the packages' build)
  - "tools"

# cli-kit is not published yet: it comes from its local checkout until it is, and this line goes before the first
# push (a link outside the repository is never published)
overrides:
  "@ensiria/cli-kit": "link:../cli-kit"
