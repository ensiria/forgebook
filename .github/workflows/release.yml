# Releases the packages when develop is merged into main, each with its own version: from the conventional commits
# that touch it since its last release (in 0.x a breaking change bumps the minor, a feature or a fix the patch; a package
# whose dependency was released gets a patch), its changelog, the release commit and a tag per package, a GitHub release
# per package, then each released package staged on npm with provenance through trusted publishing (no token). A staged
# version is public only once a maintainer approves it with 2FA (`npm stage approve`), so this workflow alone cannot put
# a version in front of users. The release commit then goes back to develop. The first release is published by hand
# (npm cannot trust a workflow for a package that does not exist yet): see CONTRIBUTING.md.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "An explicit version (when the commits do not say it); empty takes it from the commits"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # the release commit, its tag and the GitHub release
  contents: write
  # npm's trusted publishing and the provenance statement
  id-token: write

jobs:
  release:
    # the release commit itself, pushed to main by this job, releases nothing
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    # npm trusts this environment only, which runs from main only: no other job or branch can publish
    environment: npm
    steps:
      # main and develop take no direct push, except from the release app: its token, made for this run and revoked
      # at its end, pushes the release commit, its tags and the merge back to develop (the workflow's own token cannot
      # be exempted from the rules)
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks
      # the versions, the changelogs, the release commit, the tags and the GitHub releases; npm is the next step
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"
          if [ -n "$VERSION" ]; then
            pnpm nx release "$VERSION" --skip-publish
          else
            pnpm nx release --skip-publish
          fi
      # every package whose version is not on npm yet, packed by pnpm (it applies publishConfig and turns workspace:
      # ranges into versions; npm does neither) and staged in dependency order, so the approvals can follow it; a
      # failed stage is retried by running the workflow again. The trust relationship allows staging only
      - name: Stage on npm
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for folder in story-format forgebook react testing vue nextjs svelte solid preact web-components; do
            name=$(node -p "require('./packages/$folder/package.json').name")
            version=$(node -p "require('./packages/$folder/package.json').version")
            # npm can stage only a package it knows: a new one is published by hand once these are public (CONTRIBUTING.md)
            if ! npm view "$name" version >/dev/null 2>&1; then
              echo "::warning::$name is not on npm yet: publish it by hand, see CONTRIBUTING.md"
              continue
            fi
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is on npm already"
              continue
            fi
            tarball=$(pnpm --filter "./packages/$folder" pack --pack-destination "$RUNNER_TEMP/packages" | tail -n 1)
            npm stage publish "$tarball" --provenance
          done
      # npm prints why a trusted-publishing exchange failed only in its full log
      - name: Keep npm's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-logs
          path: ~/.npm/_logs
      - name: Bring the release commit back to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-edit main
          git push origin develop
