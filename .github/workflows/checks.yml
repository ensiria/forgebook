# Every push and pull request to develop and main: types, lint, unit tests, the published manifests and the build, on
# the oldest Node the packages support and on the current one; the shell's browser tests on the fixture catalogue; both
# again on Windows; the weight of Forgebook against its budget; and the commits checked, since the release reads them.
# Actions are pinned to a commit (Dependabot moves them), so a moved tag cannot change what runs.
name: checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # by hand, to run the checks on a branch without a new commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fixture/app exec playwright install chromium
      - shell: pwsh
        run: Start-Process pwsh -ArgumentList '-NoProfile','-File','tools/diag/fast.ps1','-Out',"$env:RUNNER_TEMP\fast.txt" -WindowStyle Hidden
      - run: pnpm --filter @fixture/app test:shell --trace retain-on-failure
        env:
          FORGEBOOK_SHELL_GROUP: 1/3
      - if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\fast.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: diag-${{ matrix.copy }}
          path: fixtures/app/test-results
          retention-days: 3
