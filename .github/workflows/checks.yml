# Every push and pull request to develop and main: types, lint, unit tests, the published manifests and the build, on
# the oldest Node the packages support and on the current one; the shell's browser tests on the fixture catalogue; both
# again on Windows; the weight of Forgebook against its budget; and the commits checked, since the release reads them.
# Actions are pinned to a commit (Dependabot moves them), so a moved tag cannot change what runs.
name: checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # by hand, to run the checks on a branch without a new commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fixture/app exec playwright install --with-deps chromium
      - run: pnpm --filter @fixture/app test:shell
      # what a failed browser test saw (its page, the frames in it, the error): a failure that shows on one runner only
      # can then be read instead of guessed; one per attempt, so a rerun keeps the failure before it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: shell-test-results-${{ github.run_attempt }}
          path: fixtures/app/test-results
          retention-days: 7
      # the README's preview recipe: a build under a sub-path, kept as an artefact, its pages asked for under that path
      - run: pnpm --filter @fixture/app exec forgebook build --out preview --base "/pr-${{ github.event.number || 0 }}/"
      - run: grep -q "/pr-${{ github.event.number || 0 }}/assets/" fixtures/app/preview/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-preview
          path: fixtures/app/preview
          retention-days: 1

  # the checks and the shell's browser tests on Windows, where Node writes paths with backslashes and a package's
  # command is a .cmd file only a shell starts: a catalogue that works on macOS and Linux must work there too
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the browser before the checks: a failed unit test then still leaves the shell tests a browser to run in, so
      # their results show beside the failure instead of a missing executable
      - run: pnpm --filter @fixture/app exec playwright install chromium
      - run: pnpm checks
      # a third of the catalogues at a time: each is a dev server of about a gigabyte, and all of them at once fill the
      # runner's 16 GB up to its commit limit, where sockets fail (net::ERR_NO_BUFFER_SPACE) and the machine stalls for
      # seconds; a trace of each failed test (its requests, the frames' consoles), for a failure only this runner shows;
      # each group runs even when the checks or a group before it failed, and keeps its results apart
      - if: ${{ !cancelled() }}
        run: pnpm --filter @fixture/app test:shell --trace retain-on-failure
        env:
          FORGEBOOK_SHELL_GROUP: 1/3
      - if: ${{ !cancelled() }}
        run: pnpm --filter @fixture/app test:shell --trace retain-on-failure
        env:
          FORGEBOOK_SHELL_GROUP: 2/3
      - if: ${{ !cancelled() }}
        run: pnpm --filter @fixture/app test:shell --trace retain-on-failure
        env:
          FORGEBOOK_SHELL_GROUP: 3/3
      # the bench kit's launcher, as a person starts it, so a launcher is never first run by a person: from a bare folder
      # through its downloads, pnpm's activation, the clone and the install to the help of the kit's Node part, no
      # measurement; and the results file each way, with nothing installed, from the installed kit, and past a kit left
      # by an older launch
      - name: bench kit launcher
        if: ${{ !cancelled() }}
        shell: powershell
        timeout-minutes: 30
        env:
          FORGEBOOK_BENCH_HOME: ${{ runner.temp }}\bench-kit
          FORGEBOOK_BENCH_DESKTOP: ${{ runner.temp }}\bench-kit-desktop
          FORGEBOOK_BENCH_NO_PAUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = $env:FORGEBOOK_BENCH_DESKTOP
          New-Item -ItemType Directory -Path $desktop | Out-Null
          function Start-Launcher([string] $Arguments) {
            $output = Join-Path $env:RUNNER_TEMP 'bench-kit-output.txt'
            cmd /c "tools\bench\kit\start-bench.cmd $Arguments > `"$output`" 2>&1"
            $code = $LASTEXITCODE
            Get-Content -LiteralPath $output -Encoding UTF8
            if ($code -ne 0) { throw "start-bench.cmd $Arguments ended with code $code" }
            return
          }
          function Assert-OneResult([string] $Pattern) {
            $found = @(Get-ChildItem -LiteralPath $desktop -Filter $Pattern)
            if ($found.Count -ne 1) { throw "expected one $Pattern on the Desktop, found $($found.Count)" }
            Get-ChildItem -LiteralPath $desktop | Remove-Item -Force
          }
          Start-Launcher '--results'
          Assert-OneResult 'forgebook-bench-registri-*.zip'
          Start-Launcher '--help'
          $log = Get-Content -LiteralPath (Join-Path $env:FORGEBOOK_BENCH_HOME 'logs\launcher.log') -Encoding UTF8 -Raw
          if ($log -notmatch 'Kit finito \(codice 0\)') { throw 'the launcher did not reach the kit''s Node part' }
          $marker = Join-Path $env:FORGEBOOK_BENCH_HOME 'repo\node_modules\.kit-installed'
          if (-not (Test-Path -LiteralPath (Join-Path $env:FORGEBOOK_BENCH_HOME 'bin\yarn.cmd'))) { throw 'no yarn on the PATH' }
          Start-Launcher '--results'
          Assert-OneResult 'forgebook-bench-risultati-*.zip'
          Set-Content -LiteralPath $marker -Value 'a commit of an older launch'
          Start-Launcher '--results'
          Assert-OneResult 'forgebook-bench-registri-*.zip'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-bench-kit-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-kit/logs
          retention-days: 7
      # what a failed browser test saw (its page, the frames in it, the error): a failure that shows on one runner only
      # can then be read instead of guessed; one per attempt, so a rerun keeps the failure before it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-shell-test-results-${{ github.run_attempt }}
          path: fixtures/app/test-results
          retention-days: 7

  # the weight of Forgebook against tools/bench/budget.json: a heavier change fails here, with the number
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgebook/tools exec playwright install --with-deps chromium
      - run: >-
          node tools/bench/bench.mts --markdown --work "$RUNNER_TEMP/bench" --budget tools/bench/budget.json
          --components 20 --stories 100 --runs 3 --metric install --metric start --metric build
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: budget-report
          path: ${{ runner.temp }}/bench/report.json

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # a pull request's commits on top of its base; a push's since what the branch was
      - run: node tools/check-commits/check-commits.mts --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
