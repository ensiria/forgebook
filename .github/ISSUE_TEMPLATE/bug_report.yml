name: Bug report
description: Something in Forgebook does not work as its documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem goes through **Security › Report a vulnerability**, never here.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest story (and forgebook.config.ts, when it matters) that shows it, and the command you run.
      render: tsx
    validations:
      required: true
  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: "forgebook 0.1.0, @forgebook/react 0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "24.15.0"
    validations:
      required: true
  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options: [npm, pnpm, yarn, bun, other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 142, macOS 26"
